<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After Dark</title>

    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <div class="contenedor">
        <a href="docs/manual_usuario.pdf" download class="link-manual" title="Descargar Manual de Usuario">
            <i class="fa-solid fa-book"></i> Manual Usuario
        </a>
        <a href="docs/manual_tecnico.pdf" download class="link-manual" title="Descargar Manual Técnico">
            <i class="fa-solid fa-gear"></i> Manual Técnico
        </a>
        <div class="contenido-principal">

            <div class="panel-izquierdo">
                <div class="logo">
                    KARAOKE - BAR
                </div>
                <h1>
                    Bienvenido <br>
                    a After Dark
                </h1>
                <p class="subtitulo">
                    Ingrese sus credenciales para acceder al sistema
                </p>

                <form id="formularioLogin">

                    <input type="text" id="usuario" placeholder="Usuario">
                    <input type="password" id="contrasena" placeholder="Contraseña">
                    <button type="submit">
                        Iniciar Sesión
                    </button>

                    <p id="mensajeError"></p>
                </form>
            </div>


            <div class="panel-derecho">
                <div class="contenido-panel">
                    <img src="imagenes/microfono_neon.png" class="imagen-microfono">
                    <h2>
                        Sistema de Gestión After Dark
                    </h2>
                    <p>
                        Administra productos, inventario,
                        espacios, órdenes y pagos de forma
                        rápida y segura.
                    </p>
                    <img src="imagenes/laptop_neon.png" class="imagen-laptop">
                </div>
            </div>

        </div>
    </div>
<script src="assets/js/login.js"></script>

</body>
</html>
